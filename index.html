<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='800' font-size='16' text-anchor='middle' fill='%2322c55e'%3ESO%3C/text%3E%3C/svg%3E">
  <title>Simon Olawuyi — Full-Stack Engineer</title>
  <meta name="description" content="Full-stack engineer building AI products, web apps and browser games. See selected work and book a 30-minute call.">
  <meta property="og:title" content="Simon Olawuyi — Full-Stack Engineer">
  <meta property="og:description" content="AI products, web apps and games that ship. See my work and book a call.">
  <meta property="og:url" content="https://simonolawuyi.com/">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://simonolawuyi.com/">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #16a34a;
      --accent-hi: #22c55e;
      --charcoal: #1c1c1f;
      --charcoal-2: #26262a;
      --charcoal-line: #34343a;
      --display: 'Space Grotesk', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--mono);
      background-color: #ffffff;
      color: #0a0a0a;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #fff; }
    ::-webkit-scrollbar-thumb { background: var(--accent); }
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.75s cubic-bezier(.2,.8,.2,1), transform 0.75s cubic-bezier(.2,.8,.2,1);
    }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    @keyframes shimmer { to { background-position: 200% center; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    @keyframes load { 0% { width: 0; } 100% { width: 100%; } }
    .site-nav { background: rgba(28,28,31,0.97); backdrop-filter: blur(14px); border-bottom: 1px solid var(--charcoal-line); }
    .nav-link {
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em; padding: 8px 12px;
      text-transform: uppercase; color: #d4d4d8; transition: color 0.15s, background 0.15s;
      position: relative;
    }
    .nav-link:hover { color: #fff; background: var(--charcoal-2); }
    .nav-link.active { color: #fff; }
    .nav-link.active::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 2px; height: 2px; background: var(--accent-hi); }
    .cta-primary.nav-cta { background: var(--accent); border-color: var(--accent); }
    .cta-primary.nav-cta:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
    /* charcoal sections */
    .dark { background: var(--charcoal); color: #f4f4f5; }
    .dark .pill { border-color: var(--charcoal-line); color: #a1a1aa; }
    .dark .pill:hover { border-color: var(--accent-hi); color: var(--accent-hi); background: rgba(34,197,94,0.08); }
    .dark .pill.active { border-color: var(--accent); color: #fff; background: var(--accent); }
    .dark .pill.static:hover { border-color: var(--charcoal-line); color: #a1a1aa; background: none; }
    .dark .cta-outline { color: #f4f4f5; border-color: #52525b; }
    .dark .cta-outline:hover { color: var(--accent-hi); border-color: var(--accent-hi); }
    .jump-link { display: flex; align-items: baseline; gap: 10px; padding: 18px 20px; color: #e4e4e7; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; border-right: 1px solid var(--charcoal-line); transition: background 0.15s, color 0.15s; }
    .jump-link:hover { background: var(--charcoal-2); color: #fff; }
    .jump-link:hover .jump-arrow { transform: translateY(2px); color: var(--accent-hi); }
    .jump-arrow { margin-left: auto; color: #71717a; transition: transform 0.15s, color 0.15s; }
    .rail-link { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 6px 0; font-size: 9px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #a1a1aa; transition: color 0.15s; }
    .rail-link .rail-dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #71717a; transition: all 0.15s; }
    .rail { background: rgba(28,28,31,0.92); backdrop-filter: blur(10px); border: 1px solid var(--charcoal-line); padding: 10px 14px; }
    .rail-link:hover { color: #fff; }
    .rail-link:hover .rail-dot { border-color: #fff; }
    .rail-link.active { color: #fff; }
    .rail-link.active .rail-dot { background: var(--accent); border-color: var(--accent); transform: scale(1.25); }
    .pill {
      display: inline-block; padding: 4px 12px; border: 1px solid #e5e5e5;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: #666; transition: all 0.15s; cursor: pointer;
      background: none; font-family: var(--mono);
    }
    .pill:hover { border-color: var(--accent); color: var(--accent); background: #f0fdf4; }
    .pill.active { border-color: var(--accent); color: #fff; background: var(--accent); }
    .cta-primary {
      display: inline-flex; align-items: center; gap: 8px; padding: 14px 32px;
      background: #0a0a0a; color: #fff; font-family: var(--mono); font-size: 10px;
      font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase;
      border: 1.5px solid #0a0a0a; transition: all 0.2s; cursor: pointer;
    }
    .cta-primary:hover { background: var(--accent); border-color: var(--accent); }
    .cta-outline {
      display: inline-flex; align-items: center; gap: 8px; padding: 14px 32px;
      background: transparent; color: #0a0a0a; font-family: var(--mono); font-size: 10px;
      font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase;
      border: 1.5px solid #d0d0d0; transition: all 0.2s; cursor: pointer;
    }
    .cta-outline:hover { border-color: var(--accent); color: var(--accent); }
    .pill.static { cursor: default; }
    .pill.static:hover { border-color: #e5e5e5; color: #666; background: none; }
    .work-card { transition: border-color 0.2s, box-shadow 0.2s; }
    .work-card:hover { border-color: var(--accent) !important; box-shadow: 0 8px 30px rgba(0,0,0,0.06); }
    .cover-img { transition: transform 0.5s ease; }
    .work-card:hover .cover-img { transform: scale(1.03); }
    .footer-link { font-size: 12px; color: #888; transition: color 0.15s; }
    .footer-link:hover { color: #22c55e; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .reveal { transition: none; opacity: 1; transform: none; } * { animation: none !important; } }
    .section-num { font-size: 11px; font-weight: 700; color: #ccc; letter-spacing: 0.1em; }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script>
    const scrollRevealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.07 });

    const observeExisting = () => {
      document.querySelectorAll('.reveal:not(.visible)').forEach(el => scrollRevealObserver.observe(el));
    };

    observeExisting();
    const domObserver = new MutationObserver(() => observeExisting());
    domObserver.observe(document.body, { childList: true, subtree: true });
  </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
